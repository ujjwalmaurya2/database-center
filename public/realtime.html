<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DriveBase - Realtime Inspector</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"surface":"#031427","surface-container-low":"#0b1c30","primary-container":"#4f46e5","on-surface":"#d3e4fe","on-surface-variant":"#c7c4d8","outline-variant":"#464555","background":"#031427"}}}}</script>
</head>
<body class="bg-background text-on-surface font-sans flex min-h-screen">
<nav class="w-64 bg-surface-container-low border-r border-outline-variant p-4 space-y-4">
<h1 class="text-xl font-bold">DriveBase</h1>
<ul class="space-y-2 text-sm text-on-surface-variant">
<li><a href="index.html" class="block p-2 hover:bg-surface-variant rounded">Dashboard</a></li>
<li><a href="auth.html" class="block p-2 hover:bg-surface-variant rounded">Auth</a></li>
<li><a href="database.html" class="block p-2 hover:bg-surface-variant rounded">Database</a></li>
<li><a href="storage.html" class="block p-2 hover:bg-surface-variant rounded">Storage</a></li>
<li><a href="functions.html" class="block p-2 hover:bg-surface-variant rounded">API &amp; Functions</a></li>
<li><a href="sync.html" class="block p-2 hover:bg-surface-variant rounded">Sync Engine</a></li>
<li><a href="conflicts.html" class="block p-2 hover:bg-surface-variant rounded">Conflicts</a></li>
<li><a href="recovery.html" class="block p-2 hover:bg-surface-variant rounded">Recovery Center</a></li>
<li><a href="realtime.html" class="block p-2 bg-primary-container text-white rounded font-bold">Realtime</a></li>
<li><a href="settings.html" class="block p-2 hover:bg-surface-variant rounded">Settings</a></li>
<li><a href="logs.html" class="block p-2 hover:bg-surface-variant rounded">Logs</a></li>
</ul>
</nav>

<main class="flex-1 p-6 space-y-6 overflow-y-auto">
<div class="flex justify-between items-center">
  <h2 class="text-2xl font-bold">Realtime Channels &amp; WebSocket Pub/Sub</h2>
  <span class="text-xs text-emerald-400 font-mono">Redis Pub/Sub Driver Active</span>
</div>

<!-- Active Channels Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="channelsGrid">
  <div class="p-4 bg-surface-container-low rounded-xl border border-outline-variant text-center text-xs text-on-surface-variant">Loading channels...</div>
</div>

<!-- Broadcast Tester Card -->
<div class="bg-surface-container-low p-6 rounded-xl border border-outline-variant space-y-4">
  <h3 class="font-bold text-sm text-on-surface">Test Broadcast Message</h3>
  <form id="broadcastForm" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
    <input id="bcChannel" type="text" placeholder="Channel Name (e.g. global:presence)" value="global:presence" class="bg-surface border border-outline-variant rounded px-3 py-2 text-xs text-on-surface font-mono" required/>
    <input id="bcEvent" type="text" placeholder="Event Name (e.g. user_typing)" value="user_typing" class="bg-surface border border-outline-variant rounded px-3 py-2 text-xs text-on-surface font-mono" required/>
    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded font-semibold text-xs transition">Broadcast Event</button>
  </form>
  <div id="bcAlert" class="hidden p-3 text-xs rounded font-mono"></div>
</div>
</main>

<script src="js/api-client.js"></script>
<script>
  DriveBaseAPI.requireAuth();

  async function loadRealtimeChannels() {
    try {
      const res = await DriveBaseAPI.getRealtimeChannels();
      if (res.data) {
        renderChannels(res.data);
      }
    } catch(e) {
      console.warn('Realtime channels load error:', e.message);
    }
  }

  function renderChannels(channels) {
    const grid = document.getElementById('channelsGrid');
    if (!channels || channels.length === 0) {
      grid.innerHTML = `<div class="col-span-3 p-4 bg-surface-container-low rounded-xl border border-outline-variant text-center text-xs text-on-surface-variant">No active channels.</div>`;
      return;
    }
    grid.innerHTML = channels.map(c => `
      <div class="p-5 rounded-xl bg-surface-container-low border border-outline-variant space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-indigo-400 font-bold font-mono text-xs">${c.name}</span>
          <span class="px-2 py-0.5 rounded text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800">${c.mode}</span>
        </div>
        <div class="flex justify-between items-end pt-2">
          <div>
            <span class="text-[10px] text-on-surface-variant block uppercase">CONNECTED CLIENTS</span>
            <span class="text-2xl font-bold text-emerald-400 font-mono">${c.connectedClients}</span>
          </div>
          <span class="text-xs text-on-surface-variant font-mono">Peak: ${c.peakClients}</span>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('broadcastForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const channel = document.getElementById('bcChannel').value;
    const event = document.getElementById('bcEvent').value;
    const alert = document.getElementById('bcAlert');
    try {
      const res = await DriveBaseAPI.broadcastRealtime(channel, event, { timestamp: new Date() });
      alert.className = 'p-3 text-xs rounded font-mono bg-emerald-900/40 text-emerald-300 border border-emerald-500/30';
      alert.innerText = `✓ Broadcasted '${event}' event to ${res.data.recipients} clients on '${channel}'!`;
      alert.classList.remove('hidden');
      loadRealtimeChannels();
    } catch(err) {
      alert.className = 'p-3 text-xs rounded font-mono bg-red-900/40 text-red-300 border border-red-500/30';
      alert.innerText = err.message;
      alert.classList.remove('hidden');
    }
  });

  document.addEventListener('DOMContentLoaded', loadRealtimeChannels);
</script>
</body></html>
